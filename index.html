<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram VIP Channels</title>
<style>
:root{--tg-bg:#0e1621;--tg-panel:#17212b;--tg-panel2:#232e3c;--tg-text:#f5f5f5;--tg-muted:#879097;--tg-blue:#2ea6ff;--tg-gold:#ecca59;--tg-red:#ef4444;--tg-border:#0b1118}
*{box-sizing:border-box}
body{margin:0;background:var(--tg-bg);color:var(--tg-text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;
-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
.app-container{max-width:600px;margin:auto;min-height:100vh;background:var(--tg-bg);display:flex;flex-direction:column}
.tg-header{background:var(--tg-panel);padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--tg-border);position:sticky;top:0;z-index:10}
.tg-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#333}
.tg-header-info h1{font-size:17px;margin:0;color:var(--tg-text)}
.tg-header-info span{font-size:13px;color:var(--tg-muted)}

.chat-list{flex:1;padding:8px 0}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background .2s}
.chat-item:hover{background:var(--tg-panel2)}
.chat-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0}
.chat-info{flex:1;border-bottom:1px solid var(--tg-panel2);padding-bottom:10px}
.chat-title{font-weight:600;font-size:15px;color:var(--tg-text);display:flex;justify-content:space-between}
.chat-preview{font-size:13px;color:var(--tg-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

/* تحسين نافذة عرض القناة وحل مشكلة الجزء العلوي */
.channel-view{display:none;flex-direction:column;height:100vh;background:#0f1721;position:fixed;inset:0;z-index:1000;max-width:600px;margin:auto;overflow:hidden}
.tg-chat-header{background:var(--tg-panel);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--tg-border);flex-shrink:0;z-index:1001;min-height:60px}
.back-btn{background:none;border:0;color:var(--tg-blue);font-size:16px;font-weight:600;cursor:pointer;padding:4px 8px}
.chat-messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg-bubble{background:var(--tg-panel);padding:10px 14px;border-radius:12px;max-width:85%;word-break:break-word;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.msg-bubble.admin{background:#1b365d;align-self:flex-start}

.tg-card{background:var(--tg-panel);border-radius:12px;padding:14px;margin:12px;border:1px solid var(--tg-border)}
.tg-btn{background:var(--tg-blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:inline-block}
.tg-btn.secondary{background:var(--tg-panel2);color:var(--tg-text)}
.tg-btn.danger{background:var(--tg-red);color:#fff}
.tg-field{background:var(--tg-bg);border:1px solid var(--tg-border);color:var(--tg-text);padding:10px 12px;border-radius:8px;width:100%;margin:6px 0 12px;font:inherit;outline:none}
.tg-footer{text-align:center;color:var(--tg-muted);font-size:11px;padding:20px}
</style>
</head>
<body oncontextmenu="return false;">

<div class="app-container">
  <header class="tg-header">
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" class="tg-avatar">
    <div class="tg-header-info">
      <h1 id="platformTitle">Telegram VIP Channels</h1>
      <span id="subCountText">المشتركين: 500</span>
    </div>
  </header>

  <div class="chat-list" id="chatsListContainer"></div>

  <div class="tg-card" id="adminLoginCard">
    <h3 style="margin:0 0 8px 0;font-size:14px;color:var(--tg-gold);">🔐 بوابة المالك السرية</h3>
    <p style="font-size:12px;color:var(--tg-muted);margin:0 0 8px 0;">هذه اللوحة مخفية عن الزوار:</p>
    <input class="tg-field" id="adminPassInput" type="password" placeholder="كلمة مرور المالك السرية...">
    <button class="tg-btn secondary" id="btnLoginAdmin">دخول كمالك</button>
  </div>

  <div class="tg-card" id="ownerPanelContainer" style="display:none;">
    <h3 style="margin:0 0 10px 0;font-size:15px;color:var(--tg-gold);">⚙️ لوحة تحكم المالك وإنشاء القنوات</h3>
    <button class="tg-btn secondary" id="btnLogoutAdmin" style="margin-bottom:10px;background:#ef4444;color:#fff;">إغلاق وضع المالك وخروج</button>
    
    <div style="border-top:1px solid var(--tg-border);padding-top:10px;margin-top:10px;">
      <label style="font-size:12px;color:var(--tg-gold);">➕ إنشاء قناة جديدة:</label>
      <input class="tg-field" id="newCName" type="text" placeholder="اسم القناة...">
      
      <label style="font-size:11px;color:var(--tg-muted);">صورة أيقونة القناة من الاستوديو:</label>
      <input class="tg-field" id="newCImgFile" type="file" accept="image/*" style="padding:4px;font-size:12px;">

      <input class="tg-field" id="newCMonth" type="number" placeholder="سعر الاشتراك الشهري ($)..." value="10">
      <input class="tg-field" id="newCLife" type="number" placeholder="سعر الاشتراك المفتوح ($)..." value="45">
      <input class="tg-field" id="newCPay" type="url" placeholder="رابط حسابك البنكي لدفع الزبائن...">
      <button class="tg-btn" id="btnAddChannel">إنشاء القناة الآن 🚀</button>
    </div>
  </div>

  <div class="tg-card">
    <h3 style="margin:0 0 8px 0;font-size:14px;">🔐 حفظ اشتراكاتك في حسابك (للزوار)</h3>
    <input class="tg-field" id="authEmail" type="email" placeholder="البريد الإلكتروني...">
    <input class="tg-field" id="authPassword" type="password" placeholder="كلمة المرور...">
    <div style="display:flex;gap:8px;">
      <button class="tg-btn" id="signUpBtn" type="button">تسجيل الحساب</button>
      <button class="tg-btn secondary" id="signInBtn" type="button">دخول</button>
    </div>
    <div id="authStatus" style="font-size:12px;color:var(--tg-muted);margin-top:8px;"></div>
  </div>

  <div class="tg-footer">Telegram Style Secure Platform · 2026</div>
</div>

<div class="channel-view" id="channelViewModal">
  <!-- هيدر القناة العلوي واضع تماماً ومحمي -->
  <div class="tg-chat-header">
    <button class="back-btn" id="btnBackToHome">← رجوع</button>
    <img id="modalChanImg" src="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
    <div style="flex:1;">
      <h3 id="modalChanTitle" style="margin:0;font-size:15px;color:var(--tg-text);">اسم القناة</h3>
      <span style="font-size:11px;color:var(--tg-muted);" id="modalChanSub">قناة محمية</span>
    </div>
    <!-- زر حذف القناة يظهر للمالك فقط -->
